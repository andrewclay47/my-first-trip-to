name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The Supabase URL and anon key are public client-side values;
          # data access is protected by row-level security rules, not by these.
          VITE_SUPABASE_URL: https://ehpavdhqbeesaejutzoc.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVocGF2ZGhxYmVlc2FlanV0em9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTUwMDIsImV4cCI6MjEwMjQ3MTAwMn0.dSPAlrH4ysCIs0sbID3UAmZWv8i0iOxNrSw5KtlWKzE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
